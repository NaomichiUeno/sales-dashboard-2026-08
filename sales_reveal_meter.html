<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026年8月チーム売上順位</title>
<style>
:root{
  color-scheme:dark;
  --gold:#E8C77A;
  --gold-light:#F6DEA0;
  --text:#F3F0E8;
  --muted:rgba(243,240,232,.55);
  --line:rgba(232,199,122,.20);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100svh;padding:64px 32px;
  display:grid;place-items:center;
  background-color:#060B14;
  background-image:radial-gradient(ellipse 70% 55% at 50% 0%,rgba(232,199,122,.055),transparent 75%),linear-gradient(180deg,#060B14 0%,#060B14 35%,#020408 100%);
  background-attachment:fixed;
  color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{width:min(100%,1040px)}
header{padding-bottom:32px;border-bottom:1px solid var(--line)}
.eyebrow{margin:0 0 18px;color:var(--gold);font-size:10px;font-weight:500;letter-spacing:.28em;line-height:1.8}
header strong{display:block;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(27px,3.4vw,42px);font-weight:500;letter-spacing:.07em;line-height:1.6}
header>span{display:block;margin-top:12px;color:var(--muted);font-size:11px;letter-spacing:.10em;line-height:1.8}
.hero{padding:52px 0 0}
.team{margin:0 0 16px;font-size:15px;font-weight:500;letter-spacing:.16em;color:var(--muted)}
.amount{
  display:table;max-width:100%;font-family:"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums;letter-spacing:-.045em;font-size:clamp(44px,9.4vw,110px);font-weight:400;line-height:1.1;white-space:nowrap;
  color:var(--gold-light);background:linear-gradient(135deg,#F3F0E8 15%,#F6DEA0 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.track-wrap{padding-top:64px;padding-bottom:32px}
.track{height:22px;background:rgba(255,255,255,.06);border-radius:3px;position:relative}
.fill{position:absolute;inset:0 auto 0 0;width:0;overflow:hidden;border-radius:3px;background:linear-gradient(90deg,#9D702E 0%,#E3BE68 62%,#FFF0B5 100%)}
.fill::after{content:"";position:absolute;inset:0 0 0 auto;width:2px;background:rgba(255,240,181,.45);box-shadow:0 0 10px 3px rgba(246,222,160,.20)}
.marker{position:absolute;top:-9px;bottom:-9px;border-left:1px solid rgba(232,199,122,.45);pointer-events:none}
.marker span{position:absolute;bottom:calc(100% + 12px);left:0;transform:translateX(-50%);color:var(--muted);font-size:11px;letter-spacing:.06em;white-space:nowrap}
.marker.b{left:34.1702222222%}.marker.c{left:94.5658888889%}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;letter-spacing:.06em;margin-top:22px}
.benchmarks{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.benchmark{padding:25px 28px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.025);box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 4px 16px rgba(0,0,0,.08)}
.benchmark p{margin:0 0 13px;color:var(--muted);font-size:12px;letter-spacing:.10em}
.benchmark strong{font-family:"Helvetica Neue",Arial,sans-serif;font-size:clamp(20px,3vw,30px);font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.controls{display:flex;gap:12px;margin-top:36px}
button{appearance:none;font:inherit;font-size:13px;letter-spacing:.08em;min-height:48px;border-radius:8px;padding:0 28px;cursor:pointer;border:1px solid rgba(243,240,232,.20);background:transparent;color:var(--muted)}
button.primary{background:linear-gradient(135deg,#F1D58B,#C99D49);color:#100D07;border-color:transparent;min-width:160px;font-weight:600}
@media(hover:hover){button.primary:hover:not(:disabled){box-shadow:0 3px 16px rgba(232,199,122,.14)}button:not(.primary):hover{border-color:var(--line);color:var(--text)}}
button:disabled{cursor:default;opacity:.5}
button:focus-visible{outline:2px solid var(--gold-light);outline-offset:5px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}
.results{padding:44px 0 0}
.results h1{margin:0 0 26px;font-size:18px;font-weight:500;letter-spacing:.15em}
.ranking{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.rank-card{display:grid;grid-template-columns:64px 1fr auto;gap:24px;align-items:center;padding:27px 30px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.025);box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 4px 16px rgba(0,0,0,.08)}
.rank-card:first-child{border-color:rgba(232,199,122,.42);background:linear-gradient(110deg,rgba(232,199,122,.07),rgba(255,255,255,.025))}
.rank{font-family:Georgia,serif;font-size:30px;font-weight:400;color:var(--muted)}
.rank-card:first-child .rank{color:var(--gold)}
.rank small{font-family:system-ui,sans-serif;font-size:11px;margin-left:6px}
.rank-team{font-size:18px;font-weight:500;letter-spacing:.07em}
.rank-money{text-align:right}
.rank-money span{display:block;color:var(--muted);font-size:10px;letter-spacing:.10em;margin-bottom:8px}
.rank-money strong{font-family:"Helvetica Neue",Arial,sans-serif;font-size:clamp(24px,3.6vw,36px);font-weight:400;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.rank-card:first-child .rank-money strong{color:var(--gold-light)}
.result-note{font-size:10px;letter-spacing:.05em;color:var(--muted);margin:20px 0 0}
.results h1:focus{outline:none}
@media(max-width:540px){
  body{padding:36px 22px}
  header{padding-bottom:24px}
  .eyebrow{font-size:8px;letter-spacing:.18em;margin-bottom:14px}
  header strong{font-size:clamp(23px,5.9vw,31px);letter-spacing:.02em}
  header>span{font-size:10px;margin-top:10px}
  .hero{padding-top:36px}.team{font-size:12px;margin-bottom:16px}
  .amount{font-size:clamp(36px,10.5vw,57px);letter-spacing:-.045em}
  .track-wrap{padding-top:50px;padding-bottom:28px}.track{height:18px}
  .marker span{font-size:10px}.marker.c span{transform:translateX(-80%)}
  .axis{font-size:9px;margin-top:18px}
  .benchmarks{gap:12px}.benchmark{padding:20px 14px}
  .benchmark p{font-size:10px;margin-bottom:11px}.benchmark strong{font-size:clamp(16px,4.8vw,25px)}
  .controls{margin-top:28px}button{padding:0 22px;min-height:46px}button.primary{min-width:140px}
  .results{padding-top:32px}.results h1{font-size:16px;margin-bottom:22px}
  .rank-card{grid-template-columns:36px 1fr;gap:10px 14px;padding:22px 20px}
  .rank{grid-row:1 / 3;font-size:28px}.rank small{margin-left:3px;font-size:10px}
  .rank-team{font-size:15px}.rank-money{grid-column:2;text-align:left}
  .rank-money strong{font-size:clamp(22px,6.6vw,32px)}.rank-money span{font-size:9px;margin-bottom:5px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<main>
  <header><p class="eyebrow">2026 AUGUST · TEAM SALES RANKING</p><strong>2026年8月チーム売上順位</strong><span>物販＋AI · CO差し引き後</span></header>
  <section class="hero" id="meter-screen" aria-labelledby="team-name">
    <h1 class="team" id="team-name">Aチーム</h1>
    <div class="amount" id="amount">¥0</div>
    <div class="track-wrap">
      <div class="track" id="meter" role="meter" aria-label="Aチーム純売上" aria-valuemin="0" aria-valuemax="90000000" aria-valuenow="0" aria-valuetext="0円">
        <div class="fill" id="fill"></div>
        <div class="marker b" aria-hidden="true"><span>Bチーム</span></div>
        <div class="marker c" aria-hidden="true"><span>Cチーム</span></div>
      </div>
      <div class="axis" aria-hidden="true"><span>0</span><span>9,000万円</span></div>
    </div>
    <div class="benchmarks">
      <div class="benchmark"><p>Bチーム</p><strong>¥30,753,200</strong></div>
      <div class="benchmark"><p>Cチーム</p><strong>¥85,109,300</strong></div>
    </div>
  </section>
  <section class="results" id="results-screen" aria-labelledby="results-title" hidden>
    <h1 id="results-title" tabindex="-1">総合順位</h1>
    <ol class="ranking">
      <li class="rank-card"><div class="rank">1<small>位</small></div><div class="rank-team">Cチーム</div><div class="rank-money"><span>着金額</span><strong>¥85,109,300</strong></div></li>
      <li class="rank-card"><div class="rank">2<small>位</small></div><div class="rank-team">Aチーム</div><div class="rank-money"><span>着金額</span><strong>¥82,630,800</strong></div></li>
      <li class="rank-card"><div class="rank">3<small>位</small></div><div class="rank-team">Bチーム</div><div class="rank-money"><span>着金額</span><strong>¥30,753,200</strong></div></li>
    </ol>
    <p class="result-note">物販＋AI · CO差し引き後</p>
  </section>
  <div class="controls"><button class="primary" id="start" type="button">開始</button><button id="reset" type="button">リセット</button></div>
  <p class="sr-only" id="status" role="status" aria-live="polite"></p>
</main>
<script>
'use strict';
const target = 82630800;
const maximum = 90000000;
const duration = 8000;
const amount = document.getElementById('amount');
const fill = document.getElementById('fill');
const meter = document.getElementById('meter');
const startButton = document.getElementById('start');
const status = document.getElementById('status');
const meterScreen = document.getElementById('meter-screen');
const resultsScreen = document.getElementById('results-screen');
const resultsTitle = document.getElementById('results-title');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
let frame = null;
let resultsTimer = null;
let running = false;
function render(value) {
  amount.textContent = '¥' + value.toLocaleString('ja-JP');
  fill.style.width = (value / maximum * 100) + '%';
  meter.setAttribute('aria-valuenow', String(value));
  meter.setAttribute('aria-valuetext', value.toLocaleString('ja-JP') + '円');
}
function showResults() {
  resultsTimer = null;
  meterScreen.hidden = true;
  resultsScreen.hidden = false;
  startButton.hidden = true;
  resultsTitle.focus({preventScroll: true});
  status.textContent = '総合順位。1位Cチーム、85,109,300円。2位Aチーム、82,630,800円。3位Bチーム、30,753,200円。';
}
function finish() {
  if (frame !== null) cancelAnimationFrame(frame);
  frame = null;
  running = false;
  render(target);
  status.textContent = 'Aチームの純売上は82,630,800円です。';
  if (resultsTimer !== null) clearTimeout(resultsTimer);
  resultsTimer = setTimeout(showResults, 2000);
}
function reset() {
  if (resultsTimer !== null) clearTimeout(resultsTimer);
  resultsTimer = null;
  resultsScreen.hidden = true;
  meterScreen.hidden = false;
  startButton.hidden = false;
  if (frame !== null) cancelAnimationFrame(frame);
  frame = null;
  running = false;
  startButton.disabled = false;
  render(0);
  status.textContent = 'リセットしました。';
}
startButton.addEventListener('click', () => {
  if (running || startButton.disabled) return;
  running = true;
  startButton.disabled = true;
  status.textContent = '売上メーターを開始しました。';
  if (reducedMotion.matches) { finish(); return; }
  const began = performance.now();
  function tick(now) {
    if (!running) return;
    const progress = Math.min(1, (now - began) / duration);
    // A gentle slowdown keeps the last part of the rise easy to follow.
    const eased = 1 - Math.pow(1 - progress, 1.6);
    render(Math.floor(target * eased));
    if (progress === 1) { finish(); return; }
    frame = requestAnimationFrame(tick);
  }
  frame = requestAnimationFrame(tick);
});
document.getElementById('reset').addEventListener('click', reset);
reducedMotion.addEventListener('change', event => { if (event.matches && running) finish(); });
</script>
</body>
</html>
