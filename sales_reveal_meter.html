<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026年8月 売上メーター</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#101310;color:#f6f6ee;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;display:grid;place-items:center;padding:48px 24px}main{width:min(100%,1000px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:24px;border-bottom:1px solid #343b32;font-size:14px;color:#b9c0b5}header strong{font-weight:500;color:#eef0e8}.hero{padding:60px 0 48px}.team{margin:0 0 12px;font-size:18px;font-weight:500;color:#c7d6b1}.amount{font-variant-numeric:tabular-nums;letter-spacing:-.055em;font-size:clamp(44px,9vw,100px);font-weight:650;line-height:1.15;white-space:nowrap}.track-wrap{padding-top:58px;padding-bottom:40px}.track{height:36px;background:#262e24;border-radius:5px;position:relative}.fill{position:absolute;inset:0 auto 0 0;width:0;background:#c4e99b;border-radius:5px;box-shadow:0 0 32px #b9df8015}.marker{position:absolute;top:-12px;bottom:-12px;border-left:1px solid #929d86;pointer-events:none}.marker span{position:absolute;bottom:calc(100% + 12px);left:0;transform:translateX(-50%);color:#b9c0b5;font-size:13px;white-space:nowrap}.marker.b{left:34.1702222222%}.marker.c{left:94.5658888889%}.axis{display:flex;justify-content:space-between;color:#87927f;font-size:12px;margin-top:22px}.benchmarks{display:grid;grid-template-columns:1fr 1fr;gap:16px}.benchmark{padding:24px;border:1px solid #343e2f;border-radius:10px;background:#171d16}.benchmark p{margin:0 0 10px;color:#aebb9f;font-size:14px}.benchmark strong{font-size:clamp(20px,3vw,30px);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.03em}.controls{display:flex;gap:12px;margin-top:40px}button{appearance:none;font:inherit;font-size:15px;min-height:48px;border-radius:7px;padding:0 30px;cursor:pointer;border:1px solid #485440;background:transparent;color:#d7ddcf}button.primary{background:#c4e99b;color:#182011;border-color:#c4e99b;min-width:150px;font-weight:650}button:disabled{cursor:default;opacity:.5}button:focus-visible{outline:3px solid #fff;outline-offset:5px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:540px){body{padding:30px 20px}.hero{padding:44px 0 30px}.team{font-size:16px}.track-wrap{padding-top:48px;padding-bottom:28px}.track{height:28px}.benchmark{padding:20px 14px}.benchmarks{gap:10px}.controls{margin-top:30px}header{font-size:12px}.marker.c span{transform:translateX(-75%)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
[hidden]{display:none!important}.results{padding:48px 0 8px}.results h1{margin:0 0 28px;font-size:clamp(26px,4vw,40px);font-weight:600;letter-spacing:.02em}.ranking{list-style:none;padding:0;margin:0;display:grid;gap:12px}.rank-card{display:grid;grid-template-columns:64px 1fr auto;gap:20px;align-items:center;padding:26px 28px;border:1px solid #343e2f;border-radius:10px;background:#171d16}.rank-card:first-child{border-color:#b3ce89;background:#222d1c}.rank{font-size:26px;font-weight:600;color:#aebb9f}.rank-card:first-child .rank{color:#d5edab}.rank small{font-size:14px;margin-left:4px}.rank-team{font-size:20px;font-weight:500}.rank-money{text-align:right}.rank-money span{display:block;color:#aebb9f;font-size:12px;margin-bottom:5px}.rank-money strong{font-size:clamp(24px,3.6vw,36px);font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}.result-note{font-size:12px;color:#aebb9f;margin:16px 0 0}.hero{padding-bottom:8px}.results h1:focus{outline:none}@media(max-width:540px){.results{padding-top:36px}.rank-card{grid-template-columns:42px 1fr;gap:10px 12px;padding:20px}.rank{grid-row:1 / 3;font-size:24px}.rank-team{font-size:17px}.rank-money{grid-column:2;text-align:left}.rank-money strong{font-size:clamp(23px,7vw,32px)}.rank-money span{font-size:11px;margin-bottom:3px}}
</style>
</head>
<body>
<main>
  <header><strong>2026年8月</strong><span>物販＋AI · CO差し引き後</span></header>
  <section class="hero" id="meter-screen" aria-labelledby="team-name">
    <h1 class="team" id="team-name">Aチーム</h1>
    <div class="amount" id="amount">¥0</div>
    <div class="track-wrap">
      <div class="track" id="meter" role="meter" aria-label="Aチーム純売上" aria-valuemin="0" aria-valuemax="90000000" aria-valuenow="0" aria-valuetext="0円">
        <div class="fill" id="fill"></div>
        <div class="marker b" aria-hidden="true"><span>Bチーム</span></div>
        <div class="marker c" aria-hidden="true"><span>Cチーム</span></div>
      </div>
      <div class="axis" aria-hidden="true"><span>0</span><span>9,000万円</span></div>
    </div>
    <div class="benchmarks">
      <div class="benchmark"><p>Bチーム</p><strong>¥30,753,200</strong></div>
      <div class="benchmark"><p>Cチーム</p><strong>¥85,109,300</strong></div>
    </div>
  </section>
  <section class="results" id="results-screen" aria-labelledby="results-title" hidden>
    <h1 id="results-title" tabindex="-1">総合順位</h1>
    <ol class="ranking">
      <li class="rank-card"><div class="rank">1<small>位</small></div><div class="rank-team">Cチーム</div><div class="rank-money"><span>着金額</span><strong>¥85,109,300</strong></div></li>
      <li class="rank-card"><div class="rank">2<small>位</small></div><div class="rank-team">Aチーム</div><div class="rank-money"><span>着金額</span><strong>¥82,630,800</strong></div></li>
      <li class="rank-card"><div class="rank">3<small>位</small></div><div class="rank-team">Bチーム</div><div class="rank-money"><span>着金額</span><strong>¥30,753,200</strong></div></li>
    </ol>
    <p class="result-note">物販＋AI · CO差し引き後</p>
  </section>
  <div class="controls"><button class="primary" id="start" type="button">開始</button><button id="reset" type="button">リセット</button></div>
  <p class="sr-only" id="status" role="status" aria-live="polite"></p>
</main>
<script>
'use strict';
const target = 82630800;
const maximum = 90000000;
const duration = 8000;
const amount = document.getElementById('amount');
const fill = document.getElementById('fill');
const meter = document.getElementById('meter');
const startButton = document.getElementById('start');
const status = document.getElementById('status');
const meterScreen = document.getElementById('meter-screen');
const resultsScreen = document.getElementById('results-screen');
const resultsTitle = document.getElementById('results-title');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
let frame = null;
let resultsTimer = null;
let running = false;
function render(value) {
  amount.textContent = '¥' + value.toLocaleString('ja-JP');
  fill.style.width = (value / maximum * 100) + '%';
  meter.setAttribute('aria-valuenow', String(value));
  meter.setAttribute('aria-valuetext', value.toLocaleString('ja-JP') + '円');
}
function showResults() {
  resultsTimer = null;
  meterScreen.hidden = true;
  resultsScreen.hidden = false;
  startButton.hidden = true;
  resultsTitle.focus({preventScroll: true});
  status.textContent = '総合順位。1位Cチーム、85,109,300円。2位Aチーム、82,630,800円。3位Bチーム、30,753,200円。';
}
function finish() {
  if (frame !== null) cancelAnimationFrame(frame);
  frame = null;
  running = false;
  render(target);
  status.textContent = 'Aチームの純売上は82,630,800円です。';
  if (resultsTimer !== null) clearTimeout(resultsTimer);
  resultsTimer = setTimeout(showResults, 2000);
}
function reset() {
  if (resultsTimer !== null) clearTimeout(resultsTimer);
  resultsTimer = null;
  resultsScreen.hidden = true;
  meterScreen.hidden = false;
  startButton.hidden = false;
  if (frame !== null) cancelAnimationFrame(frame);
  frame = null;
  running = false;
  startButton.disabled = false;
  render(0);
  status.textContent = 'リセットしました。';
}
startButton.addEventListener('click', () => {
  if (running || startButton.disabled) return;
  running = true;
  startButton.disabled = true;
  status.textContent = '売上メーターを開始しました。';
  if (reducedMotion.matches) { finish(); return; }
  const began = performance.now();
  function tick(now) {
    if (!running) return;
    const progress = Math.min(1, (now - began) / duration);
    // A gentle slowdown keeps the last part of the rise easy to follow.
    const eased = 1 - Math.pow(1 - progress, 1.6);
    render(Math.floor(target * eased));
    if (progress === 1) { finish(); return; }
    frame = requestAnimationFrame(tick);
  }
  frame = requestAnimationFrame(tick);
});
document.getElementById('reset').addEventListener('click', reset);
reducedMotion.addEventListener('change', event => { if (event.matches && running) finish(); });
</script>
</body>
</html>
