<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0c0b">
<title>2026年8月チーム売上順位</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:#0c0c0b;color:#f4eee0;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;padding:64px 24px}
main{width:min(100%,1020px);margin:auto}
header{text-align:center;padding:0 0 44px}
.emblem{display:block;width:44px;height:44px;margin:0 auto 22px;color:#d3b778}
h1{margin:0;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(22px,3.4vw,36px);font-weight:600;line-height:1.6;letter-spacing:.1em;text-wrap:balance}
.header-rule{width:64px;height:1px;background:#c5a568;margin:24px auto 0}
.ranking{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.rank-card{position:relative;display:grid;grid-template-columns:100px 1fr auto;gap:32px;align-items:center;padding:36px 42px;border:1px solid #494030;background:#141311}
.rank-card:first-child{padding-top:48px;padding-bottom:48px;border-color:#c1a263;background:linear-gradient(110deg,#2b2417,#181611 70%);box-shadow:inset 0 0 0 5px #19160f,inset 0 0 0 6px #574629}
.rank{width:80px;height:80px;border:1px solid #766241;border-radius:50%;display:flex;align-items:baseline;justify-content:center;padding-top:9px;color:#c4aa78;font-family:Georgia,"Times New Roman",serif;font-size:44px;line-height:1.2}
.rank small{font-family:system-ui,sans-serif;font-size:12px;margin-left:5px}
.rank-card:first-child .rank{border-color:#d5b775;background:linear-gradient(140deg,#f2dfab,#c5a360);color:#272014;box-shadow:0 0 0 5px #231e14,0 0 0 6px #8d7549}
.rank-team{margin:0;font-size:26px;font-weight:500;letter-spacing:.06em}
.rank-card:first-child .rank-team{font-size:32px;color:#ead5a2}
.rank-money{text-align:right}
.rank-money span{display:block;color:#b9aa8e;font-size:12px;letter-spacing:.16em;margin-bottom:8px}
.rank-money strong{display:block;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-variant-numeric:lining-nums tabular-nums;font-size:clamp(32px,4.4vw,48px);letter-spacing:-.025em;line-height:1.15;white-space:nowrap}
.rank-card:first-child .rank-money strong{color:#efdaa4;font-size:clamp(36px,5vw,56px)}
footer{margin-top:28px;text-align:center;color:#b0a28a;font-size:12px;line-height:1.7;letter-spacing:.06em}
@media(max-width:640px){body{padding:36px 18px}header{padding-bottom:32px}.emblem{width:36px;height:36px;margin-bottom:16px}h1{font-size:22px;letter-spacing:.04em}.header-rule{margin-top:20px}.ranking{gap:12px}.rank-card,.rank-card:first-child{grid-template-columns:56px minmax(0,1fr);gap:10px 22px;padding:26px 24px}.rank{grid-row:1 / 3;width:52px;height:52px;padding-top:6px;font-size:29px}.rank small{font-size:10px;margin-left:3px}.rank-team,.rank-card:first-child .rank-team{font-size:20px}.rank-money{grid-column:2;text-align:left}.rank-money span{font-size:10px;margin-bottom:5px}.rank-money strong,.rank-card:first-child .rank-money strong{font-size:clamp(26px,7.4vw,40px)}footer{margin-top:22px;font-size:11px}}
@media(max-width:360px){body{padding-inline:12px}.rank-card,.rank-card:first-child{padding-inline:18px;column-gap:16px}h1{font-size:20px}}
</style>
</head>
<body>
<main>
  <header>
    <svg class="emblem" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="m8 15 8 7 8-13 8 13 8-7-4 21H12L8 15Z" stroke="currentColor" stroke-width="1.5"/><path d="M13 40h22M13 31h22" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="12" r="2" fill="currentColor"/><circle cx="24" cy="6" r="2" fill="currentColor"/><circle cx="40" cy="12" r="2" fill="currentColor"/></svg>
    <h1>2026年8月チーム売上順位</h1>
    <div class="header-rule" aria-hidden="true"></div>
  </header>
  <ol class="ranking" aria-label="総合売上順位">
    <li class="rank-card"><div class="rank">1<small>位</small></div><h2 class="rank-team">Cチーム</h2><div class="rank-money"><span>着金額</span><strong>¥85,109,300</strong></div></li>
    <li class="rank-card"><div class="rank">2<small>位</small></div><h2 class="rank-team">Aチーム</h2><div class="rank-money"><span>着金額</span><strong>¥82,630,800</strong></div></li>
    <li class="rank-card"><div class="rank">3<small>位</small></div><h2 class="rank-team">Bチーム</h2><div class="rank-money"><span>着金額</span><strong>¥30,753,200</strong></div></li>
  </ol>
  <footer>物販＋AI 合計 · CO差し引き後</footer>
</main>
</body>
</html>
