<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Sales Reveal — 2026年8月</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:       #FFD700;
  --gold-light: #FFF5B0;
  --gold-dark:  #996600;
  --gold-mid:   #E6A800;
}

html, body {
  width: 100%; height: 100%;
  background: #000;
  color: #fff;
  font-family: 'Noto Sans JP', sans-serif;
  user-select: none;
  overflow: hidden;
  cursor: pointer;
}

/* ===== STAGE BG ===== */
#stage-bg {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 90% 55% at 50% -5%, rgba(200,150,0,0.22) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 10% 40%, rgba(180,120,0,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 40%, rgba(180,120,0,0.07) 0%, transparent 60%),
    linear-gradient(180deg, #080500 0%, #030200 100%);
}
#stage-bg::after {
  content: '';
  position: absolute; inset: 0;
  background:
    conic-gradient(from 267deg at 30% -8%, transparent 0deg, rgba(255,210,0,0.05) 5deg, transparent 10deg),
    conic-gradient(from 265deg at 50% -8%, transparent 0deg, rgba(255,215,0,0.08) 6deg, transparent 12deg),
    conic-gradient(from 263deg at 70% -8%, transparent 0deg, rgba(255,210,0,0.05) 5deg, transparent 10deg);
}

/* ===== BOKEH ===== */
#bokeh { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.bokeh-orb {
  position: absolute; border-radius: 50%;
  animation: bokeh var(--dur) var(--delay) infinite ease-in-out alternate;
  filter: blur(var(--blur));
}
@keyframes bokeh {
  from { opacity: var(--lo); transform: translate(0,0); }
  to   { opacity: var(--hi); transform: translate(var(--tx),var(--ty)); }
}

/* ===== PARTICLES ===== */
#particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.particle {
  position: absolute; border-radius: 50%; opacity: 0;
  animation: pdrift var(--dur) var(--delay) infinite linear;
}
@keyframes pdrift {
  0%   { transform: translateY(-5vh) rotate(0deg); opacity: 0; }
  8%   { opacity: 0.6; }
  92%  { opacity: 0.15; }
  100% { transform: translateY(105vh) rotate(var(--rot)); opacity: 0; }
}

/* ===== APP ===== */
#app {
  position: relative; z-index: 10;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}

/* ===== INTRO ===== */
#intro { text-align: center; animation: fadeUp 0.9s ease both; }
.intro-eyebrow {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(9px,1.2vw,12px); letter-spacing: 6px;
  color: var(--gold); text-transform: uppercase; margin-bottom: 24px;
}
.intro-title {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(2.2rem,7vw,5.5rem); font-weight: 900; line-height: 1.05;
  background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 16px;
}
.intro-sub { font-size: clamp(12px,1.4vw,15px); color: rgba(255,255,255,0.32); letter-spacing: 2px; margin-bottom: 56px; }
.tap-cta {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(10px,1.3vw,13px); letter-spacing: 5px;
  color: var(--gold); text-transform: uppercase;
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.28;transform:scale(0.97)} }

/* ===== REVEAL SCREEN ===== */
#reveal-screen {
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  width: 100%; padding: 12px 12px 0;
  gap: 0;
}

/* Top label */
.screen-label {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: clamp(14px,1.8vw,22px); letter-spacing: 3px;
  color: rgba(255,215,0,0.9); font-weight: 700;
  margin-bottom: clamp(12px,2.5vh,24px);
  animation: fadeUp 0.6s ease both;
}

/* Teams row */
.teams-row {
  display: flex;
  flex-direction: column;
  gap: clamp(10px,1.8vh,20px);
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 1200px;
  margin-bottom: clamp(14px,2.5vh,26px);
}

/* Individual team panel */
.team-panel {
  width: 100%; max-width: 1200px;
  display: flex; flex-direction: row;
  align-items: center;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,215,0,0.18);
  border-radius: 18px;
  padding: clamp(14px,2.5vh,24px) clamp(10px,1.8vw,20px);
  backdrop-filter: blur(8px);
  transition: border-color 0.4s, box-shadow 0.4s;
  position: relative;
  overflow: hidden;
  gap: clamp(12px,2vw,28px);
}

/* Pre-deduction section (left) */
.panel-pre {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-width: clamp(150px,18vw,220px);
  padding-right: clamp(10px,1.5vw,20px);
  border-right: 1px solid rgba(255,215,0,0.15);
  flex-shrink: 0;
}
.pre-label {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: clamp(11px,1.3vw,15px); letter-spacing: 3px;
  color: rgba(255,215,0,0.9); font-weight: 700;
  margin-bottom: 8px; white-space: nowrap;
}
.pre-amount {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(1.1rem,2.2vw,1.7rem); font-weight: 900;
  color: var(--gold-light);
  white-space: nowrap;
}

/* Main section (right) */
.panel-main {
  display: flex; flex-direction: column; align-items: center;
  flex: 1;
}
.team-panel::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-dark));
  opacity: 0.7;
}
.team-panel.just-revealed {
  border-color: rgba(255,215,0,0.55);
  box-shadow: 0 0 30px rgba(255,215,0,0.15), 0 0 60px rgba(255,215,0,0.06);
  animation: panel-flash 0.6s ease;
}
@keyframes panel-flash {
  0%  { box-shadow: 0 0 60px rgba(255,215,0,0.5); }
  100%{ box-shadow: 0 0 30px rgba(255,215,0,0.15); }
}

.panel-team-name {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(0.9rem,2vw,1.5rem); font-weight: 900;
  background: linear-gradient(135deg, #fff 0%, var(--gold) 70%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: clamp(8px,1.5vh,14px);
  letter-spacing: 2px;
}

.currency-prefix {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(1rem,2.2vw,1.8rem); font-weight: 900;
  color: var(--gold); margin-bottom: 6px; opacity: 0.8;
}

/* Digit row per team */
.digit-row {
  display: flex; align-items: center; justify-content: center;
  gap: clamp(2px,0.4vw,5px); flex-wrap: nowrap;
}
.sep {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(0.9rem,2vw,2rem); font-weight: 900;
  color: rgba(255,215,0,0.55); padding-bottom: 3px;
  flex-shrink: 0;
}

/* Slot */
.slot {
  position: relative; flex-shrink: 0;
  width: clamp(26px,3.6vw,48px); height: clamp(38px,5.6vw,72px);
  border-radius: clamp(5px,0.7vw,9px);
  background: #0C0900; border: 1px solid rgba(255,215,0,0.15);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  box-shadow: inset 0 1px 0 rgba(255,215,0,0.06);
  transition: border-color 0.3s;
}
.slot.idle { animation: slot-pulse 2.6s var(--spd) infinite ease-in-out; }
@keyframes slot-pulse {
  0%,100%{ border-color:rgba(255,215,0,0.1); }
  50%    { border-color:rgba(255,215,0,0.3); box-shadow:inset 0 1px 0 rgba(255,215,0,0.08), 0 0 10px rgba(255,215,0,0.06); }
}
.slot-q {
  position: absolute;
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(0.9rem,2vw,2.2rem); font-weight: 900;
  color: rgba(255,215,0,0.35); transition: opacity 0.1s;
}
.slot-digit {
  position: absolute;
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(1rem,2.2vw,2.4rem); font-weight: 900;
  background: linear-gradient(180deg, #fff 0%, var(--gold) 60%, var(--gold-mid) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  transform: rotateX(90deg); opacity: 0;
  filter: drop-shadow(0 0 6px rgba(255,215,0,0.5));
}
.slot-flash {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, rgba(255,255,200,0.95), rgba(255,215,0,0.55) 50%, transparent 75%);
  opacity: 0; pointer-events: none;
}
.slot.revealing .slot-q    { opacity: 0; }
.slot.revealing .slot-flash { animation: flash 0.45s ease both; }
.slot.revealing .slot-digit { animation: flipIn 0.45s 0.06s cubic-bezier(0.34,1.56,0.64,1) both; }
@keyframes flash  { 0%{opacity:0.95} 40%{opacity:0.55} 100%{opacity:0} }
@keyframes flipIn {
  0%  { transform:rotateX(90deg) scale(0.7); opacity:0; }
  60% { transform:rotateX(-8deg) scale(1.1); opacity:1; }
  100%{ transform:rotateX(0deg)  scale(1);   opacity:1; }
}
.slot.revealed {
  border-color: rgba(255,215,0,0.45);
  box-shadow: inset 0 1px 0 rgba(255,215,0,0.1), 0 0 12px rgba(255,215,0,0.12);
  animation: none;
}
/* 最初から表示されている桁 */
.slot.pre-shown .slot-q { opacity: 0; }
.slot.pre-shown .slot-digit { transform: rotateX(0deg) scale(1); opacity: 1; }
/* Highlight the just-revealed slot */
.slot.just-now {
  border-color: rgba(255,215,0,0.9) !important;
  box-shadow: 0 0 20px rgba(255,215,0,0.45) !important;
}

/* Round counter */
.round-info {
  display: flex; align-items: center; gap: 20px;
  margin-bottom: clamp(10px,2vh,18px);
}
.round-label {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(9px,1vw,12px); letter-spacing: 3px;
  color: rgba(255,215,0,0.9); text-transform: uppercase;
}
.round-digits-left {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(9px,1vw,12px); letter-spacing: 3px;
  color: rgba(255,215,0,0.65); text-transform: uppercase;
}

/* Progress bar */
.progress-track {
  width: 180px; height: 3px;
  background: rgba(255,215,0,0.1); border-radius: 100px; overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 100px;
  background: linear-gradient(90deg, var(--gold-dark), var(--gold));
  width: 0%; transition: width 0.4s ease;
}

/* Tap hint */
.tap-hint {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(9px,1.1vw,12px); letter-spacing: 5px;
  color: rgba(255,215,0,0.65); text-transform: uppercase;
  margin-top: clamp(8px,1.5vh,14px);
  animation: pulse 1.8s ease-in-out infinite;
  transition: opacity 0.3s;
}
.tap-hint.hidden { opacity: 0; pointer-events: none; }

/* ===== FINAL ===== */
#final-screen {
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; width: 100%; padding: 0 24px;
}
.final-label {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(9px,1.2vw,12px); letter-spacing: 6px;
  color: var(--gold); text-transform: uppercase; margin-bottom: 24px;
  animation: fadeUp 0.7s ease both;
}
.final-ranking {
  display: flex; flex-direction: column; gap: clamp(12px,2vh,22px);
  width: 100%; max-width: 820px;
  animation: fadeUp 0.7s 0.1s ease both;
}
.rank-card {
  display: flex; align-items: center; gap: 20px;
  padding: clamp(12px,2vh,20px) clamp(16px,2.5vw,28px);
  border-radius: 16px; backdrop-filter: blur(8px);
  border: 1px solid rgba(255,215,0,0.2);
  background: rgba(255,255,255,0.03);
  transition: box-shadow 0.3s;
}
.rank-card.rank-1 {
  border-color: rgba(255,215,0,0.8);
  background: rgba(255,215,0,0.1);
  box-shadow: 0 0 50px rgba(255,215,0,0.25), 0 0 100px rgba(255,215,0,0.08);
  padding: clamp(20px,3.5vh,32px) clamp(24px,3.5vw,40px);
  transform: scale(1);
  animation: fadeUp 0.7s 0.15s cubic-bezier(0.34,1.56,0.64,1) both;
}
.rank-card.rank-2 {
  padding: clamp(14px,2.3vh,22px) clamp(18px,2.8vw,30px);
  transform: scale(0.92);
  animation: fadeUp 0.7s 0.3s ease both;
}
.rank-card.rank-3 {
  padding: clamp(10px,1.6vh,16px) clamp(14px,2.2vw,24px);
  transform: scale(0.82);
  animation: fadeUp 0.7s 0.45s ease both;
}
.rank-badge {
  font-family: 'Montserrat', sans-serif;
  font-weight: 900; text-align: center; flex-shrink: 0;
}
.rank-1 .rank-badge {
  font-size: clamp(2.6rem,5.8vw,4.4rem);
  min-width: clamp(70px,8.5vw,100px);
  color: #FFD700; filter: drop-shadow(0 0 12px rgba(255,215,0,0.7));
}
.rank-2 .rank-badge {
  font-size: clamp(1.8rem,3.8vw,2.8rem);
  min-width: clamp(50px,6vw,72px);
  color: #C0C0C0;
}
.rank-3 .rank-badge {
  font-size: clamp(1.4rem,2.9vw,2.1rem);
  min-width: clamp(42px,5vw,60px);
  color: #CD7F32;
}
.rank-info { flex: 1; text-align: left; }
.rank-team-name {
  font-family: 'Montserrat', sans-serif;
  font-weight: 700; letter-spacing: 3px; margin-bottom: 6px;
}
.rank-1 .rank-team-name {
  font-size: clamp(1.2rem,2.4vw,1.7rem);
  color: var(--gold-light);
}
.rank-2 .rank-team-name {
  font-size: clamp(1rem,1.9vw,1.3rem);
  color: rgba(255,255,255,0.8);
}
.rank-3 .rank-team-name {
  font-size: clamp(0.85rem,1.5vw,1.1rem);
  color: rgba(255,255,255,0.65);
}
.rank-amt {
  font-family: 'Montserrat', sans-serif;
  font-weight: 900; color: var(--gold-light);
}
.rank-1 .rank-amt {
  font-size: clamp(2.6rem,6.5vw,4.6rem);
  background: linear-gradient(135deg,#fff 0%,var(--gold) 50%,#FFA500 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  filter: drop-shadow(0 0 20px rgba(255,215,0,0.5));
}
.rank-2 .rank-amt {
  font-size: clamp(1.7rem,4.1vw,2.7rem);
}
.rank-3 .rank-amt {
  font-size: clamp(1.3rem,3vw,1.9rem);
  color: rgba(255,245,176,0.85);
}
.final-message { margin-top: 22px; font-size: clamp(11px,1.3vw,14px); color: rgba(255,255,255,0.38); letter-spacing:3px; animation: fadeUp 0.7s 0.6s ease both; }

/* ===== CELEBRATION ===== */
#celebration { position: fixed; inset: 0; z-index: 100; pointer-events: none; display: none; }
#celebration canvas { position:absolute;inset:0;width:100%;height:100%; }

@keyframes fadeUp  { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
@keyframes scaleIn { from{opacity:0;transform:scale(0.55)} to{opacity:1;transform:scale(1)} }
</style>
</head>
<body>

<div id="stage-bg"></div>
<div id="bokeh"></div>
<div id="particles"></div>

<div id="app">
  <div id="intro">
    <div class="intro-eyebrow">2026 August · Team Sales Award</div>
    <div class="intro-title">チーム別<br>売上発表</div>
    <div class="intro-sub">1の位から順番に発表します</div>
    <div class="tap-cta">▶ TAP TO START</div>
  </div>

  <div id="reveal-screen">
    <div class="screen-label">2026年8月 チーム別売上発表</div>
    <div class="round-info">
      <div class="round-label" id="roundLabel">準備中...</div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="round-digits-left" id="digitsLeft"></div>
    </div>
    <div class="teams-row" id="teamsRow"></div>
    <div class="tap-hint" id="tapHint">TAP TO REVEAL</div>
  </div>

  <div id="final-screen">
    <div class="final-ranking" id="finalRanking"></div>
  </div>
</div>

<div id="celebration"><canvas id="confettiCanvas"></canvas></div>

<script>
/* ============================================================
   ★★★ データをここで変更 ★★★
   ============================================================ */
const TEAMS = [
  { name: "A チーム", sales: 82_630_800, preSales: 115_774_000 },
  { name: "B チーム", sales: 30_753_200, preSales: 37_385_200 },
  { name: "C チーム", sales: 85_109_300, preSales: 92_695_300 },
];
/* ============================================================ */

// 各チームのトークン列を生成（表示順：左→右）
function buildTokens(amount) {
  const str = amount.toLocaleString('ja-JP');
  return [...str].map(ch => ch === ',' ? { type:'sep' } : { type:'digit', val:ch });
}

const GRAND_TOTAL = TEAMS.map(t => t.sales).reduce((a, b) => a + b, 0);
const teamTokens  = TEAMS.map(t => buildTokens(t.sales));
// 各チームの digit インデックス配列（左→右）
const digitCounts = teamTokens.map(toks => toks.filter(t => t.type === 'digit').length);
const maxDigits   = Math.max(...digitCounts); // 全チーム同じはずだが念のため

// Aチームのみ段階的に解放する
const REVEAL_TEAM_INDEX = 0;

// ラウンド毎に解放する位置（右からの位置 0=1の位）
// 1〜十万は1個ずつ、最後に百万・千万を一斉解放
const REVEAL_ROUNDS = [
  [0], // 1の位
  [1], // 10の位
  [2], // 100の位
  [3], // 千の位
  [4], // 万の位
  [5], // 十万の位
  [6, 7], // 百万・千万 一斉
];
const TOTAL_ROUNDS = REVEAL_ROUNDS.length;

let phase     = 'intro';
let round     = 0;          // 0 = 1の位ラウンド
let audioCtx  = null;

// ---- Audio ----
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playTone(isLast) { /* sound disabled */ }

// ---- Build UI ----
function buildRevealUI() {
  const row = document.getElementById('teamsRow');
  row.innerHTML = '';

  TEAMS.forEach((team, ti) => {
    const tokens = teamTokens[ti];
    const panel  = document.createElement('div');
    panel.className = 'team-panel';
    panel.id = `panel-${ti}`;

    // 左側：クーリングオフ控除前
    const preSection = document.createElement('div');
    preSection.className = 'panel-pre';
    preSection.innerHTML = `
      <div class="pre-label">売上</div>
      <div class="pre-amount">¥${team.preSales.toLocaleString('ja-JP')}</div>
    `;

    // 右側：チーム名 + 桁表示
    const mainSection = document.createElement('div');
    mainSection.className = 'panel-main';

    const nameEl = document.createElement('div');
    nameEl.className = 'panel-team-name';
    nameEl.textContent = team.name;

    const prefix = document.createElement('div');
    prefix.className = 'currency-prefix';
    prefix.textContent = '¥';

    const digitRow = document.createElement('div');
    digitRow.className = 'digit-row';
    digitRow.id = `drow-${ti}`;

    const isRevealTeam = (ti === REVEAL_TEAM_INDEX);
    let di = 0;
    tokens.forEach(tok => {
      if (tok.type === 'sep') {
        const s = document.createElement('div');
        s.className = 'sep'; s.textContent = ',';
        digitRow.appendChild(s);
      } else {
        const slot = document.createElement('div');
        // B・Cチームは最初から解放状態
        slot.className = isRevealTeam ? 'slot idle' : 'slot revealed pre-shown';
        slot.style.setProperty('--spd', `${di * 0.12}s`);
        slot.id = `slot-${ti}-${di}`;
        slot.innerHTML = `
          <div class="slot-q">?</div>
          <div class="slot-digit">${tok.val}</div>
          <div class="slot-flash"></div>
        `;
        digitRow.appendChild(slot);
        di++;
      }
    });

    mainSection.appendChild(nameEl);
    mainSection.appendChild(prefix);
    mainSection.appendChild(digitRow);

    panel.appendChild(preSection);
    panel.appendChild(mainSection);
    row.appendChild(panel);
  });

  updateRoundUI();
}

function updateRoundUI() {
  const revealedDigits = REVEAL_ROUNDS.slice(0, round).flat().length;
  const remaining = digitCounts[REVEAL_TEAM_INDEX] - revealedDigits;
  const placeNames = ['1の位','10の位','100の位','千の位','万の位','十万の位','百万の位','千万の位','億の位'];
  const placeName = REVEAL_ROUNDS[round].map(pos => placeNames[pos]).join('・');

  document.getElementById('roundLabel').textContent  = `次: ${placeName}`;
  document.getElementById('digitsLeft').textContent  = `残り ${remaining} 桁`;
  const pct = (revealedDigits / digitCounts[REVEAL_TEAM_INDEX]) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
}

// ---- Reveal one round (Aチームのみ、指定された桁位置を一括解放) ----
function revealRound() {
  const isLast = (round === TOTAL_ROUNDS - 1);
  const ti = REVEAL_TEAM_INDEX;
  const positions = REVEAL_ROUNDS[round] || [];

  // パネル全体をフラッシュ
  const panel = document.getElementById(`panel-${ti}`);
  panel.classList.remove('just-revealed');
  panel.offsetHeight; // reflow
  panel.classList.add('just-revealed');

  positions.forEach(posFromRight => {
    const digitIdx = digitCounts[ti] - 1 - posFromRight;
    const slot = document.getElementById(`slot-${ti}-${digitIdx}`);
    if (!slot) return;
    slot.classList.remove('idle');
    slot.classList.add('revealing');
    setTimeout(() => {
      slot.classList.add('just-now');
      slot.classList.add('revealed');
      setTimeout(() => slot.classList.remove('just-now'), 800);
    }, 460);
  });

  playTone(isLast);
  round++;

  if (isLast) {
    document.getElementById('tapHint').classList.add('hidden');
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('roundLabel').textContent  = '全桁 解放完了！';
    document.getElementById('digitsLeft').textContent  = '';
    setTimeout(() => {
      setTimeout(showFinal, 5000);
    }, 500);
  } else {
    updateRoundUI();
  }
}

// ---- Click handler ----
document.addEventListener('click', () => {
  initAudio();
  if (phase === 'intro') {
    phase = 'reveal';
    document.getElementById('intro').style.display = 'none';
    const rs = document.getElementById('reveal-screen');
    rs.style.display = 'flex';
    buildRevealUI();
  } else if (phase === 'reveal') {
    if (round < TOTAL_ROUNDS) revealRound();
  }
});

// ---- Final screen ----
function countUp(el, target, dur = 1800) {
  const step = 16, steps = dur / step; let i = 0;
  const timer = setInterval(() => {
    i++;
    const v = Math.round((1 - Math.pow(1 - i/steps, 3)) * target);
    el.textContent = '¥' + v.toLocaleString('ja-JP');
    if (i >= steps) { el.textContent = '¥' + target.toLocaleString('ja-JP'); clearInterval(timer); }
  }, step);
}

function showFinal() {
  phase = 'final';
  document.getElementById('reveal-screen').style.display = 'none';
  const fs = document.getElementById('final-screen');
  fs.style.display = 'flex';

  // 売上順にソートしてランキング表示
  const ranked = [...TEAMS].sort((a, b) => b.sales - a.sales);
  const medals = ['🥇', '🥈', '🥉'];
  const fr = document.getElementById('finalRanking');
  ranked.forEach((t, i) => {
    const card = document.createElement('div');
    card.className = `rank-card rank-${i + 1}`;
    card.innerHTML = `
      <div class="rank-badge">${medals[i]}</div>
      <div class="rank-info">
        <div class="rank-team-name">${t.name}</div>
        <div class="rank-amt">¥${t.sales.toLocaleString('ja-JP')}</div>
      </div>
    `;
    fr.appendChild(card);
  });
}

// ---- Confetti ----
let confettiParts = [];
let confettiRunning = false;
function runCelebration(isFull) {
  return; // confetti disabled
  const canvas = document.getElementById('confettiCanvas');
  const ctx    = canvas.getContext('2d');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  document.getElementById('celebration').style.display = 'block';
  const n      = isFull ? 400 : 80;
  const colors = ['#FFD700','#FFC200','#FFE566','#FFAA00','#FFF0A0','#fff','#FFDD44'];
  const newParts = Array.from({length:n}, () => ({
    x: Math.random()*canvas.width, y: -10 - Math.random()*(isFull?200:50),
    vx:(Math.random()-.5)*6, vy:1.5+Math.random()*4,
    w:3+Math.random()*8, h:2+Math.random()*5,
    r:Math.random()*Math.PI*2, vr:(Math.random()-.5)*0.2,
    color:colors[Math.floor(Math.random()*colors.length)],
    alpha:0.9, age:0, life: 600,
  }));
  confettiParts.push(...newParts);
  if (confettiRunning) return;
  confettiRunning = true;
  function loop() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    confettiParts = confettiParts.filter(p => {
      p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.vy+=0.07; p.age++;
      if (p.y > canvas.height+20 || p.age > p.life+20) return false;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, p.alpha*(1-p.age/p.life));
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
      return true;
    });
    if (confettiParts.length > 0) { requestAnimationFrame(loop); }
    else { confettiRunning = false; ctx.clearRect(0,0,canvas.width,canvas.height); }
  }
  loop();
}
