<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Reveal — 2026年8月</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
/* ===========================
   ★★★ 数字をここで変更 ★★★
   =========================== */

/* ===== RESET ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:       #FFD700;
  --gold-light: #FFF5B0;
  --gold-dark:  #996600;
  --gold-mid:   #E6A800;
  --bg:         #000;
  --slot-bg:    #0C0900;
  --slot-border:rgba(255,215,0,0.25);
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: #fff;
  font-family: 'Noto Sans JP', sans-serif;
  user-select: none;
  overflow: hidden;
  cursor: pointer;
}

/* ===== STAGE BG ===== */
#stage-bg {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 90% 55% at 50% -5%, rgba(200,150,0,0.22) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 10% 40%, rgba(180,120,0,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 40%, rgba(180,120,0,0.07) 0%, transparent 60%),
    linear-gradient(180deg, #080500 0%, #030200 100%);
}

/* Spotlight beams */
#stage-bg::after {
  content: '';
  position: absolute; inset: 0;
  background:
    conic-gradient(from 267deg at 30% -8%, transparent 0deg, rgba(255,210,0,0.05) 5deg, transparent 10deg),
    conic-gradient(from 265deg at 50% -8%, transparent 0deg, rgba(255,215,0,0.08) 6deg, transparent 12deg),
    conic-gradient(from 263deg at 70% -8%, transparent 0deg, rgba(255,210,0,0.05) 5deg, transparent 10deg);
}

/* ===== BOKEH ===== */
#bokeh { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.bokeh-orb {
  position: absolute; border-radius: 50%;
  animation: bokeh var(--dur) var(--delay) infinite ease-in-out alternate;
  filter: blur(var(--blur));
}
@keyframes bokeh {
  from { opacity: var(--lo); transform: translate(0,0); }
  to   { opacity: var(--hi); transform: translate(var(--tx), var(--ty)); }
}

/* ===== PARTICLES ===== */
#particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.particle {
  position: absolute; border-radius: 50%; opacity: 0;
  animation: drift var(--dur) var(--delay) infinite linear;
}
@keyframes drift {
  0%   { transform: translateY(-5vh) rotate(0deg); opacity: 0; }
  8%   { opacity: 0.7; }
  92%  { opacity: 0.2; }
  100% { transform: translateY(105vh) rotate(var(--rot)); opacity: 0; }
}

/* ===== LAYOUT ===== */
#app {
  position: relative; z-index: 10;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 0;
}

/* ===== INTRO SCREEN ===== */
#intro {
  text-align: center;
  animation: fadeIn 1s ease both;
}
.intro-label {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(9px, 1.2vw, 12px);
  letter-spacing: 6px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 28px;
}
.intro-title {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(2.2rem, 7vw, 5.5rem);
  font-weight: 900;
  line-height: 1.05;
  background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 20px;
}
.intro-sub {
  font-size: clamp(13px, 1.5vw, 16px);
  color: rgba(255,255,255,0.4);
  letter-spacing: 2px;
  margin-bottom: 60px;
}
.tap-cta {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(10px, 1.3vw, 13px);
  letter-spacing: 5px;
  color: var(--gold);
  text-transform: uppercase;
  animation: pulse-cta 1.6s ease-in-out infinite;
}
@keyframes pulse-cta {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.35; transform: scale(0.97); }
}

/* ===== REVEAL SCREEN ===== */
#reveal {
  display: none;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 0 20px;
}

.reveal-label {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(9px, 1.1vw, 11px);
  letter-spacing: 5px;
  color: rgba(255,215,0,0.55);
  text-transform: uppercase;
  margin-bottom: 24px;
  animation: fadeIn 0.6s ease both;
}

/* Currency prefix */
.currency-sign {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(2rem, 5vw, 4rem);
  font-weight: 900;
  color: var(--gold);
  margin-bottom: 12px;
  opacity: 0;
  animation: fadeIn 0.5s 0.1s ease both;
  text-shadow: 0 0 30px rgba(255,215,0,0.5);
}

/* Digit row */
.digit-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(4px, 0.8vw, 10px);
  flex-wrap: wrap;
  padding: 0 10px;
}

.separator {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(1.4rem, 4vw, 3.5rem);
  font-weight: 900;
  color: rgba(255,215,0,0.3);
  margin: 0 2px;
  padding-bottom: 6px;
}

/* Individual digit slot */
.slot {
  position: relative;
  width: clamp(48px, 9vw, 100px);
  height: clamp(72px, 13.5vw, 148px);
  border-radius: clamp(8px, 1.2vw, 14px);
  background: var(--slot-bg);
  border: 1px solid var(--slot-border);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  box-shadow: inset 0 1px 0 rgba(255,215,0,0.08), 0 4px 20px rgba(0,0,0,0.6);
  transition: border-color 0.3s, box-shadow 0.3s;
}
.slot.hidden-state {
  animation: slot-pulse 2.2s var(--spd) infinite ease-in-out;
}
@keyframes slot-pulse {
  0%, 100% { border-color: rgba(255,215,0,0.15); box-shadow: inset 0 1px 0 rgba(255,215,0,0.05), 0 4px 20px rgba(0,0,0,0.6); }
  50%       { border-color: rgba(255,215,0,0.35); box-shadow: inset 0 1px 0 rgba(255,215,0,0.12), 0 4px 24px rgba(255,215,0,0.1); }
}

/* The "?" placeholder */
.slot-q {
  position: absolute;
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(1.6rem, 3.5vw, 3.8rem);
  font-weight: 900;
  color: rgba(255,215,0,0.2);
  transition: opacity 0.15s;
}

/* The actual digit face */
.slot-digit {
  position: absolute;
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(1.8rem, 4vw, 4.4rem);
  font-weight: 900;
  background: linear-gradient(180deg, #fff 0%, var(--gold) 60%, var(--gold-mid) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  transform: rotateX(90deg);
  opacity: 0;
  filter: drop-shadow(0 0 8px rgba(255,215,0,0.6));
}

/* Flash overlay */
.slot-flash {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, rgba(255,255,220,0.9), rgba(255,215,0,0.5) 50%, transparent 75%);
  opacity: 0;
  pointer-events: none;
}

/* Reveal animation sequence */
.slot.revealing .slot-q    { opacity: 0; }
.slot.revealing .slot-flash { animation: flash-in 0.55s ease both; }
.slot.revealing .slot-digit { animation: flip-in  0.55s 0.08s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
@keyframes flash-in {
  0%   { opacity: 0.95; }
  40%  { opacity: 0.6; }
  100% { opacity: 0; }
}
@keyframes flip-in {
  0%   { transform: rotateX(90deg) scale(0.8); opacity: 0; }
  60%  { transform: rotateX(-8deg) scale(1.08); opacity: 1; }
  100% { transform: rotateX(0deg) scale(1);    opacity: 1; }
}

/* Revealed state: glowing border */
.slot.revealed {
  border-color: rgba(255,215,0,0.55);
  box-shadow: inset 0 1px 0 rgba(255,215,0,0.15), 0 0 20px rgba(255,215,0,0.2), 0 6px 28px rgba(0,0,0,0.5);
  animation: none;
}

/* Hint text */
.tap-hint {
  margin-top: clamp(24px, 4vw, 48px);
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(10px, 1.2vw, 12px);
  letter-spacing: 4px;
  color: rgba(255,215,0,0.35);
  text-transform: uppercase;
  animation: pulse-cta 1.8s ease-in-out infinite;
}
.tap-hint.hidden { opacity: 0; pointer-events: none; }

/* Progress dots */
.progress-dots {
  display: flex; gap: 6px; margin-top: 20px;
}
.dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255,215,0,0.2);
  transition: background 0.3s, transform 0.3s;
}
.dot.active { background: var(--gold); transform: scale(1.3); }
.dot.done   { background: rgba(255,215,0,0.6); }

/* ===== CELEBRATION ===== */
#celebration {
  position: fixed; inset: 0; z-index: 100;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  pointer-events: none;
}
#celebration canvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
}
.celebration-text {
  position: relative; z-index: 2;
  font-family: 'Montserrat', sans-serif;
  font-weight: 900;
  font-size: clamp(1.4rem, 4vw, 3.5rem);
  background: linear-gradient(135deg, #fff 0%, var(--gold) 50%, var(--gold-mid) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  animation: celebrate-text 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  text-shadow: none;
  filter: drop-shadow(0 0 20px rgba(255,215,0,0.5));
}
.celebration-sub {
  position: relative; z-index: 2;
  font-size: clamp(11px, 1.4vw, 14px);
  letter-spacing: 4px;
  color: rgba(255,215,0,0.65);
  text-transform: uppercase;
  margin-top: 12px;
  animation: celebrate-text 0.8s 0.15s ease both;
}
@keyframes celebrate-text {
  from { opacity: 0; transform: scale(0.5) translateY(20px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

/* ===== COMMON ===== */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div id="stage-bg"></div>
<div id="bokeh"></div>
<div id="particles"></div>

<div id="app">

  <!-- INTRO -->
  <div id="intro">
    <div class="intro-label">2026 August · Sales Award</div>
    <div class="intro-title">今月の<br>売上発表</div>
    <div class="intro-sub">物販 ＋ AI 合計</div>
    <div class="tap-cta">▶ TAP TO START</div>
  </div>

  <!-- REVEAL -->
  <div id="reveal">
    <div class="reveal-label">Total Revenue — 物販 + AI</div>
    <div class="currency-sign">¥</div>
    <div class="digit-row" id="digitRow"></div>
    <div class="progress-dots" id="progressDots"></div>
    <div class="tap-hint" id="tapHint">TAP TO REVEAL</div>
  </div>

</div>

<!-- CELEBRATION OVERLAY -->
<div id="celebration">
  <canvas id="confettiCanvas"></canvas>
  <div class="celebration-text" id="celebrationText"></div>
  <div class="celebration-sub">今月も最高でした！お疲れ様です 🎉</div>
</div>

<script>
/* ============================================================
   ★★★ 金額をここで変更してください ★★★
   （クーリングオフ控除後の確定値に更新）
   ============================================================ */
const TOTAL_AMOUNT = 198_493_300;  // ← クーリングオフ控除後の確定値
/* ============================================================ */

// ---- Build digit list (digits only, storing commas separately) ----
const formatted = TOTAL_AMOUNT.toLocaleString('ja-JP');
// Build token array: {type:'digit',val:'2'} or {type:'sep'}
const tokens = [];
for (const ch of formatted) {
  if (ch === ',') tokens.push({ type: 'sep' });
  else            tokens.push({ type: 'digit', val: ch });
}
const digitTokens = tokens.filter(t => t.type === 'digit');
const totalDigits = digitTokens.length;

// ---- State ----
let phase = 'intro';   // 'intro' | 'reveal'
let revealed = 0;
let celebrating = false;

// ---- Audio (Web Audio API) ----
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(digitIndex, isLast) { /* sound disabled */ }

// ---- Build reveal UI ----
function buildRevealUI() {
  const row  = document.getElementById('digitRow');
  const dots = document.getElementById('progressDots');
  row.innerHTML = ''; dots.innerHTML = '';

  let digitIdx = 0;
  tokens.forEach(tok => {
    if (tok.type === 'sep') {
      const sep = document.createElement('div');
      sep.className = 'separator';
      sep.textContent = ',';
      row.appendChild(sep);
    } else {
      const slot = document.createElement('div');
      slot.className = 'slot hidden-state';
      slot.style.setProperty('--spd', `${digitIdx * 0.18}s`);
      slot.dataset.digit = tok.val;
      slot.dataset.idx   = digitIdx;
      slot.innerHTML = `
        <div class="slot-q">?</div>
        <div class="slot-digit">${tok.val}</div>
        <div class="slot-flash"></div>
      `;
      row.appendChild(slot);
      digitIdx++;

      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.dataset.idx = digitIdx - 1;
      dots.appendChild(dot);
    }
  });
}

// ---- Reveal one digit ----
function revealNext() {
  if (revealed >= totalDigits || celebrating) return;

  const isLast = revealed === totalDigits - 1;
  const slots  = document.querySelectorAll('.slot');
  const slot   = slots[revealed];

  slot.classList.remove('hidden-state');
  slot.classList.add('revealing');
  setTimeout(() => slot.classList.add('revealed'), 550);

  // Progress dot
  const dots = document.querySelectorAll('.dot');
  if (dots[revealed]) {
    dots[revealed].classList.remove('active');
    dots[revealed].classList.add('done');
  }
  if (dots[revealed + 1]) dots[revealed + 1].classList.add('active');

  playTone(revealed, isLast);
  revealed++;

  if (isLast) {
    document.getElementById('tapHint').classList.add('hidden');
    setTimeout(startCelebration, 600);
  }
}

// ---- Confetti ----
let confettiParticles = [];
function startCelebration() {
  celebrating = true;
  const cel = document.getElementById('celebration');
  cel.style.display = 'flex';
  document.getElementById('celebrationText').textContent =
    '¥' + TOTAL_AMOUNT.toLocaleString('ja-JP');
  return; // confetti disabled

  const canvas = document.getElementById('confettiCanvas');
  const ctx    = canvas.getContext('2d');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ['#FFD700','#FFC200','#FFE566','#FFAA00','#FFF0A0','#fff','#FFDD44','#E6A800'];
  confettiParticles = Array.from({ length: 180 }, () => ({
    x:  Math.random() * canvas.width,
    y:  -10 - Math.random() * 200,
    vx: (Math.random() - 0.5) * 5,
    vy: 2 + Math.random() * 4,
    w:  4 + Math.random() * 8,
    h:  2 + Math.random() * 5,
    r:  Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 0.2,
    color: colors[Math.floor(Math.random() * colors.length)],
    alpha: 0.8 + Math.random() * 0.2,
  }));

  let frame = 0;
  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    confettiParticles.forEach(p => {
      p.x  += p.vx;
      p.y  += p.vy;
      p.r  += p.vr;
      p.vy += 0.06; // gravity
      if (p.y < canvas.height + 20) alive = true;
      if (p.y > canvas.height + 20) return;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.globalAlpha = p.alpha * Math.max(0, 1 - frame / 240);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    frame++;
    if (alive && frame < 260) requestAnimationFrame(loop);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  loop();
}

// ---- Global click / tap handler ----
document.addEventListener('click', () => {
  initAudio();
  if (phase === 'intro') {
    // Switch to reveal screen
    phase = 'reveal';
    buildRevealUI();
    document.getElementById('intro').style.display = 'none';
    const rev = document.getElementById('reveal');
    rev.style.display = 'flex';
    // Activate first dot
    setTimeout(() => {
      const dots = document.querySelectorAll('.dot');
      if (dots[0]) dots[0].classList.add('active');
    }, 300);
  } else if (phase === 'reveal') {
    revealNext();
  }
});

// ---- Bokeh / Particles disabled ----
</script>
</body>
</html>
